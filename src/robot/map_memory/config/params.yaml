map_memory_node:
  ros__parameters:
    frame_id: "sim_world"
    resolution: 0.1        # m / cell
    width: 40.0            # m
    height: 40.0           # m
    origin_x: -20.0        # world position of the map's bottom-left corner
    origin_y: -20.0
    update_distance: 1.5   # m travelled before fusing a new costmap
    update_period: 1.0     # s between update checks
