control_node:
  ros__parameters:
    lookahead_distance: 1.5     # m
    linear_speed: 0.8           # m/s
    min_linear_speed: 0.15      # m/s
    max_angular_speed: 1.2      # rad/s
    goal_tolerance: 0.3         # m
    slow_down_distance: 1.5     # m
    rotate_in_place_angle: 1.0  # rad
    control_rate: 10.0          # Hz
